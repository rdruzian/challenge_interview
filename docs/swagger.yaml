basePath: /api/v1
definitions:
  model.Device:
    properties:
      brand:
        type: string
      name:
        type: string
      state:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for challenge code interview, that I need to develop a CRUD system
  title: Challenge code
  version: "1.0"
paths:
  /device:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Device'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all devices
      tags:
      - device
  /device/{id}:
    delete:
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a single device
      tags:
      - device
    get:
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Device'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get device by ID
      tags:
      - device
  /device/brand/{brand}:
    get:
      parameters:
      - description: Brand
        in: path
        name: brand
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Device'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get device by Brand
      tags:
      - device
  /device/create:
    post:
      consumes:
      - application/json
      description: Create a new device on database
      parameters:
      - description: Device
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/model.Device'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Device'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new device
      tags:
      - device
  /device/state/{state}:
    get:
      parameters:
      - description: State
        in: path
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Device'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get device by State
      tags:
      - device
swagger: "2.0"
